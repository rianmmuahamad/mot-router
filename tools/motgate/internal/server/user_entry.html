<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Masuk dashboard — Arbyte</title>
<style>@font-face{font-family:Inter;src:url('/assets/fonts/InterVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font:14px/1.5 Inter,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:448px}.brand{font-size:28px;font-weight:600;letter-spacing:-.04em;display:inline-block;margin-bottom:48px;color:inherit;text-decoration:none}h1{font-size:36px;line-height:1.15;font-weight:600;letter-spacing:-.04em;margin:0 0 12px}p{color:#6b7280;margin:0 0 32px;font-size:16px}label{display:block;margin-bottom:8px;font-weight:500}input{width:100%;height:48px;border:1px solid #e5e7eb;border-radius:8px;padding:12px 14px;font:14px Inter,Arial,sans-serif;outline-offset:4px}input:focus-visible{outline:2px solid #111}button{display:block;width:100%;height:40px;margin-top:16px;border:0;border-radius:8px;background:#111;color:#fff;font:600 14px Inter,Arial,sans-serif;cursor:pointer}button:active{background:#242424}button:disabled{background:#e5e7eb;color:#6b7280;cursor:default}.note{font-size:13px;margin:24px 0 0}.note a{color:#111}#error{color:#b91c1c;font-size:13px;margin-top:12px;min-height:20px}footer{color:#898989;font-size:12px;margin-top:48px;border-top:1px solid #e5e7eb;padding-top:24px}</style></head>
<body><main class="card"><a class="brand" href="/">arbyte</a><h1>Workspace kamu,<br>satu tempat.</h1><p>Masuk dengan API key yang kamu terima dari admin untuk melihat pemakaian dan masa aktif.</p><form id="login"><label for="key">API key</label><input id="key" type="password" placeholder="mg_…" autocomplete="off" spellcheck="false" required aria-describedby="error"><button id="submit" type="submit">Buka dashboard</button><div id="error" role="status"></div></form><p class="note">Sudah punya tautan akses? Buka langsung tautan tersebut.<br>Belum punya akun? <a href="/#harga">Lihat paket Arbyte</a>.</p><footer>© 2026 Arbyte. Keep your agent building.</footer></main>
<script>'use strict';document.getElementById('login').onsubmit=async e=>{e.preventDefault();const key=document.getElementById('key').value.trim(),error=document.getElementById('error'),button=document.getElementById('submit');error.textContent='';if(!/^mg_[a-f0-9]{48}$/.test(key)){error.textContent='Periksa API key dari admin. Format key dimulai dengan mg_.';return}button.disabled=true;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);try{const response=await fetch('/api/user/'+encodeURIComponent(key),{cache:'no-store',credentials:'same-origin',signal:controller.signal});if(!response.ok){error.textContent=response.status===404?'API key tidak ditemukan. Periksa kembali key kamu.':'Belum dapat menghubungkan akun. Coba lagi.';return}location.assign('/u/'+encodeURIComponent(key))}catch{error.textContent='Tidak dapat terhubung. Periksa koneksi lalu coba lagi.'}finally{clearTimeout(timer);button.disabled=false}};</script></body></html>
